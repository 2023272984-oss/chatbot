<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini HealthBot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

<button class="mobile-menu-toggle" onclick="toggleHistoryPanel()">
  <span class="material-symbols-outlined">menu</span>
</button>
<div class="overlay" id="overlay" onclick="toggleHistoryPanel()"></div>

<div class="app-layout">

  <div id="history-panel">
    <div class="history-controls">
      <button class="new-chat-btn" onclick="createNewChat()">
        <span class="material-symbols-outlined">add</span>
        New chat
      </button>
    </div>
    
    <div class="chat-sessions" id="chat-sessions">
        </div>
  </div>

  <div class="container">
    <div class="header">
      <div class="header-left">
        <button class="desktop-menu-btn" onclick="toggleSidebar()">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h1>HealthBot</h1>
      </div>
      <button class="reset-btn" onclick="resetCurrentChat()" title="Reset Chat">
        <span class="material-symbols-outlined">refresh</span>
      </button>
    </div>

    <div id="chat-box">
      <div class="welcome-message">
        <h3>Hello, User</h3>
        <p>How can I help you be healthier today?</p>
        <div class="suggestion-chips">
          <div class="chip" onclick="sendSuggestion('Give me a 10-minute workout routine')">10-min workout</div>
          <div class="chip" onclick="sendSuggestion('Tips for better sleep hygiene')">Sleep better</div>
          <div class="chip" onclick="sendSuggestion('Healthy breakfast ideas')">Healthy breakfast</div>
          <div class="chip" onclick="sendSuggestion('How to manage stress')">Manage stress</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-container">
        <input
          type="text"
          id="user-input"
          placeholder="Enter a prompt here"
          autocomplete="off"
        />
        <button id="send-btn">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
    </div>
  </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
